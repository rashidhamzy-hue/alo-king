project_id = "alo-king"

[functions.kapso-brain]
verify_jwt = false

[functions.claim-vendor]
verify_jwt = true

[functions.merchant-ai]
verify_jwt = true

[functions.order-notify]
verify_jwt = true

[functions.whatsapp-webhook]
# Authenticated by the Kapso HMAC signature, not a Supabase JWT.
verify_jwt = false

[functions.dispatch]
# Authenticated by the dispatch secret (pg_cron), the service-role bearer (whatsapp-webhook) or Twilio's
# signature (call keypresses), not a Supabase JWT.
verify_jwt = false
# The Noto fonts the visual order card is rendered with (§32.5), read at runtime.
static_files = ["./functions/_shared/fonts/*.ttf"]

[functions.site-claim]
# The website's claim, registration and driver forms. Visitors are anonymous: the protection is the per-visitor rate
# limit, the code that goes only to the shop's own number, and human review of documents (see the function header).
verify_jwt = false

[functions.ops-slack]
# The Slack ops console (§32.1): authenticated by Slack's signing secret (SLACK_SIGNING_SECRET), not a Supabase JWT.
verify_jwt = false

[functions.flow-app]
# The Alo King Flow app's data endpoint (DECISIONS §39.15.13): authenticated by the HMAC of Kapso's data-endpoint function
# (the proxy key in app_private.flow_app_keys), not a Supabase JWT.
verify_jwt = false
