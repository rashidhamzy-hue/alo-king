project_id = "alo-king"

[functions.kapso-brain]
verify_jwt = false

[functions.claim-vendor]
verify_jwt = true

[functions.merchant-ai]
verify_jwt = true

[functions.order-notify]
verify_jwt = true

[functions.whatsapp-webhook]
# Authenticated by the Kapso HMAC signature, not a Supabase JWT.
verify_jwt = false

[functions.dispatch]
# Authenticated by the dispatch secret (pg_cron), the service-role bearer (whatsapp-webhook) or Twilio's
# signature (call keypresses), not a Supabase JWT.
verify_jwt = false
# The Noto fonts the visual order card is rendered with (§32.5), read at runtime.
static_files = ["./functions/_shared/fonts/*.ttf"]
