name: voice-label

# Labels a batch of real voice notes (DECISIONS §30.7): two OpenAI transcription models with the Lebanese
# vocabulary prompt, Claude reconciliation, and a short list of notes to confirm by listening. The result
# (labels.csv, report.md) is pushed to a new branch `data/voice-labels-<run id>`; a build session opens the
# pull request (a push made with GITHUB_TOKEN does not start CI). Nothing here touches staging.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Folder under evals/voice/
        default: batch-01
        required: true

permissions:
  contents: write

concurrency:
  group: voice-label
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Transcribe, reconcile, list the notes to confirm
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH: ${{ inputs.batch }}
        run: |
          [[ "$BATCH" =~ ^batch-[0-9]{2}$ ]] || { echo "::error::batch must look like batch-01"; exit 1; }
          node --experimental-strip-types scripts/evals/voice-label.ts "evals/voice/$BATCH"
          cat "evals/voice/$BATCH/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Push the labels to a data branch
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          branch="data/voice-labels-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "evals/voice/$BATCH/labels.csv" "evals/voice/$BATCH/report.md"
          git commit -m "Evals: voice labels for $BATCH (run $GITHUB_RUN_ID)"
          git push origin "$branch"
          echo "pushed $branch"
