# Manual. Session SIM1: about 500 simulated customer conversations with the real Concierge, and a ranked failure report.
# What runs: evals/sim (see evals/sim/README.md). A throwaway database in the job (PGlite, every migration on this ref), then a
# read-only copy of staging's catalogue and settings, read with GET through PostgREST (SUPABASE_SERVICE_KEY over the staging URL,
# the secrets product-data.yml uses). No parties, chats, orders or media are read. Kapso is never called: every send is recorded.
# The real turn code drives each conversation; the Concierge is MODEL_FAST from wrangler.jsonc; the customer and the judge are
# MODEL_SMART (Sonnet 5.5). Budget: no new conversation above USD 27, every model call refused at USD 33 (evals/sim/budget.ts);
# with the budget_usd input, no new conversation from 85% of it and every call refused at it. budget_usd is the one dollar limit.
# Cost (COST1): the run's tokens and dollars by model and role are written to model_costs (migration 0139) by the last step, from
# out/sim/model-cost.json (its cap is the hard limit above); that step only writes the cost table, and the simulation itself
# still only reads staging. The key and its own usage limit are unchanged.
# Test budget (LB1, 16 Nov; docs/NEXT_SESSIONS.md rule 12): one run per session, limit 50 by default (150 only at a gate check), and
# the first real step refuses to start when this month's sim-test spend in model_costs plus budget_usd (33 if empty) would pass the
# setting sim_monthly_cap_usd (55 for November 2026, 10 a month after; migrations 0211 and 0241), saying why in the run summary.
# Key: secrets.ANTHROPIC_API_KEY_SIM only. The job stops at once if it is missing; it never falls back to another key, and the
# key is never printed (it is passed to the one step that needs it, as an environment variable).
# Output: the artifact sim-results (report.md, cases/sim_<class>.json, results.jsonl, summary.json), the head of the report in
# the job summary, and the same files as a base64 tar.gz in the last step's log (lines starting SIMBUNDLE) for a session to read.
name: sim-test
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N scenarios (default 50: LB1, 16 Nov; 150 only at a gate check, T1 for gate A and then gate B; empty = all 500)"
        type: string
        default: "50"
      only:
        description: Comma-separated scenario ids, e.g. sim-001,sim-042 (empty = all)
        type: string
        default: ""
      concurrency:
        description: Conversations at a time
        type: string
        default: "6"
      repeats:
        description: Times each failing seed is run again while money is left
        type: string
        default: "3"
      budget_usd:
        description: "USD for this run: no new conversation from 85% of it, every call refused at it (empty = 27 and 33, as before)"
        type: string
        default: ""
      followup:
        description: "A selection file, e.g. evals/sim/followup-2026-11-15.json: its cut-off seeds run first, its failing seeds once more (empty = none)"
        type: string
        default: ""
permissions: { contents: read }
defaults:
  run: { shell: bash }
concurrency:
  group: sim-test
  cancel-in-progress: false
jobs:
  simulate:
    if: github.repository == 'rashidhamzy-hue/alo-king'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: https://lhgkvvdckwbfpdsftzqp.supabase.co
      MODEL_COST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: The simulation key is set
        env:
          ANTHROPIC_API_KEY_SIM: ${{ secrets.ANTHROPIC_API_KEY_SIM }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY_SIM" ]; then
            echo "::error::The repository secret ANTHROPIC_API_KEY_SIM is not set. The simulation uses that key only and never falls back to another; add it and run again."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY_SIM is set (not printed)."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: The monthly ceiling (LB1; refuses to start above sim_monthly_cap_usd, and says why in the run summary)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SIM_BUDGET_USD: ${{ inputs.budget_usd }}
        run: node scripts/ci/sim-ceiling.mjs
      - run: npm ci
      - name: Tests of the simulator (no key, no network; includes the proof that nothing is written to staging or sent)
        run: npx vitest run evals/sim/test
      - name: Simulate
        env:
          ALO_SIM: "1"
          ANTHROPIC_API_KEY_SIM: ${{ secrets.ANTHROPIC_API_KEY_SIM }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SIM_OUT: out/sim
          SIM_LIMIT: ${{ inputs.limit }}
          SIM_ONLY: ${{ inputs.only }}
          SIM_CONCURRENCY: ${{ inputs.concurrency }}
          SIM_REPEATS: ${{ inputs.repeats }}
          SIM_SOFT: "27"
          SIM_HARD: "33"
          SIM_BUDGET_USD: ${{ inputs.budget_usd }}
          SIM_FOLLOWUP: ${{ inputs.followup }}
          SIM_MAX_MINUTES: "280"
        run: |
          export MODEL_FAST="$(node scripts/ci/wrangler-var.mjs MODEL_FAST)"
          export MODEL_SMART="$(node scripts/ci/wrangler-var.mjs MODEL_SMART)"
          [ -z "$SIM_LIMIT" ] && unset SIM_LIMIT
          [ -z "$SIM_ONLY" ] && unset SIM_ONLY
          [ -z "$SIM_BUDGET_USD" ] && unset SIM_BUDGET_USD
          [ -z "$SIM_FOLLOWUP" ] && unset SIM_FOLLOWUP
          if [ -n "${SIM_FOLLOWUP:-}" ] && { [[ "$SIM_FOLLOWUP" != evals/sim/*.json ]] || [[ "$SIM_FOLLOWUP" == *..* ]] || [ ! -f "$SIM_FOLLOWUP" ]; }; then
            echo "::error::followup must be a JSON file under evals/sim/ on this ref"; exit 1
          fi
          echo "- concierge ${MODEL_FAST}, customer and judge ${MODEL_SMART}; limit ${SIM_LIMIT:-all}; only ${SIM_ONLY:-all}; concurrency ${SIM_CONCURRENCY}; budget ${SIM_BUDGET_USD:-27/33}; follow-up ${SIM_FOLLOWUP:-none}" >> "$GITHUB_STEP_SUMMARY"
          npx vitest run evals/sim/sim.live.test.ts --silent=false
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sim-results, path: out/sim, retention-days: 30, if-no-files-found: ignore }
      - name: Report head in the job summary
        if: always()
        run: |
          if [ -f out/sim/report.md ]; then head -n 80 out/sim/report.md >> "$GITHUB_STEP_SUMMARY"; else echo "- no report written" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Results bundle (base64 tar.gz, lines starting SIMBUNDLE)
        if: always()
        run: |
          if [ -d out/sim ]; then tar czf - -C out sim | base64 -w 4000 | sed 's/^/SIMBUNDLE /'; fi
      - name: Record the cost in model_costs (writes the cost table only)
        if: always()
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -f out/sim/model-cost.json ]; then node scripts/lib/model-cost.mjs out/sim/model-cost.json
          else echo "- no model-cost.json: the run stopped before it spent anything, or before it could write it" >> "$GITHUB_STEP_SUMMARY"; fi
