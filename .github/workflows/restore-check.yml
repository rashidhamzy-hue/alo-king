# BK0. A copy nobody has restored is a hope, not a backup. Weekly: take the newest copy, decrypt it, restore it into a throwaway
# Postgres container of the same major version, and hold the result to the manifest written when the copy was dumped:
#   - the number of migrations recorded equals the manifest's (and the repository has at least that many files),
#   - every table's row count equals the manifest's, and no table is missing or extra,
#   - the ledger sums to zero, every ledger transaction balances, and the total equals the manifest's.
# A failed check raises the ops exception `restore_check_failed` and a Sentry event, and fails the run. A green check resolves it.
# The restore happens in a container on the runner that is thrown away with the runner: it is never a real project, and the script
# refuses any database that is not on localhost. No row is ever printed; the summary shows counts only. The copy is fetched from the
# store (R2, or the private Supabase bucket if R2 is not available), decrypted with the secret BACKUP_PASSPHRASE, and never uploaded
# anywhere. Nothing here can change staging: the database is only read for the ops exception.
#
# Weekly: Monday 03:30 UTC, after the 01:30 copy. The environment is a parameter, as in backup.yml (BACKUP_ENVIRONMENTS for the
# schedule; production uses the same file with its own secrets).
name: restore-check
on:
  schedule: [{ cron: "30 3 * * 1" }]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's newest copy to restore
        type: choice
        options: [staging, production]
        default: staging
permissions: { contents: read }
defaults:
  run: { shell: bash }
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      environments: ${{ steps.p.outputs.environments }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          PICKED: ${{ inputs.environment }}
          LISTED: ${{ vars.BACKUP_ENVIRONMENTS }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then list="$PICKED"; else list="${LISTED:-staging}"; fi
          envs=$(tr ',' '\n' <<<"$list" | sed 's/[[:space:]]//g' | grep -v '^$' | jq -R . | jq -sc .)
          [ "$(jq -r 'all(.[]; . == "staging" or . == "production")' <<<"$envs")" = true ] || { echo "::error::BACKUP_ENVIRONMENTS may only name staging and production, got: $list"; exit 1; }
          echo "environments=$envs" >> "$GITHUB_OUTPUT"

  restore:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.plan.outputs.environments) }}
    concurrency:
      group: restore-check-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      SUPABASE_PROJECT_REF: ${{ fromJSON('{"staging":"lhgkvvdckwbfpdsftzqp"}')[matrix.environment] || vars.SUPABASE_PROJECT_REF_PRODUCTION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      S_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      P_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PRODUCTION }}
      S_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      P_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
      S_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      P_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_PRODUCTION }}
      S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      P_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
      S_BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      P_BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE_PRODUCTION }}
      SENTRY_DSN: ${{ matrix.environment == 'production' && vars.SENTRY_DSN_PRODUCTION || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick this environment's secrets (static references; a production run never falls back to a staging secret)
        run: |
          p=S; [ "$ENVIRONMENT" = production ] && p=P
          for n in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_KEY CLOUDFLARE_API_TOKEN BACKUP_PASSPHRASE; do
            v=$(printenv "${p}_$n" || true)
            [ -n "$v" ] || continue
            echo "::add-mask::$v"
            { echo "$n<<AK_EOF"; echo "$v"; echo "AK_EOF"; } >> "$GITHUB_ENV"
            [ "$n" != SUPABASE_DB_PASSWORD ] || { echo "PGPASSWORD<<AK_EOF"; echo "$v"; echo "AK_EOF"; } >> "$GITHUB_ENV"
          done
      - name: Check the secrets first (stops with a clear message, prints nothing secret)
        run: |
          sfx=""; [ "$ENVIRONMENT" = production ] && sfx=_PRODUCTION
          missing=""
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF_PRODUCTION (a repository variable)"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN$sfx"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD$sfx"
          [ -n "$SUPABASE_SERVICE_KEY" ] || missing="$missing SUPABASE_SERVICE_KEY$sfx"
          if [ -n "$missing" ]; then echo "::error::The $ENVIRONMENT restore check is not set up. Missing:$missing. Nothing was restored."; exit 1; fi
          node --input-type=module -e 'import { passphraseProblem } from "./scripts/backup/lib.mjs"; const p = passphraseProblem(process.env.BACKUP_PASSPHRASE); if (p) { console.log("::error::" + p.replace("Nothing was dumped.", "Nothing was restored.")); process.exit(1); }'
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: 3.1.0 }
      - name: Connection string (only to raise an ops exception if this check fails)
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          test -s supabase/.temp/pooler-url || { echo "no pooler url after link"; exit 1; }
          echo "DATABASE_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - name: Fetch the newest copy
        run: |
          node scripts/backup/store.mjs fetch --out "$RUNNER_TEMP/copy.tar.gpg" > "$RUNNER_TEMP/newest.json" || { echo "::error::There is no readable copy of the $ENVIRONMENT database to restore."; exit 1; }
          echo "PG_MAJOR=$(jq -r .pg_major "$RUNNER_TEMP/newest.json")" >> "$GITHUB_ENV"
          jq -r '"- restoring `\(.key)` from \(.store): made \(.created_at), \(.age_hours) hours ago, \(.bytes) bytes, Postgres \(.pg_major)"' "$RUNNER_TEMP/newest.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Throwaway Postgres container, same major version as the copy
        run: |
          [[ "$PG_MAJOR" =~ ^[0-9]{2}$ ]] || { echo "::error::the index does not say which Postgres made the copy"; exit 1; }
          docker run -d --name restore-pg -e POSTGRES_PASSWORD=restore -p 127.0.0.1:55432:5432 "postgres:$PG_MAJOR" >/dev/null
          for i in $(seq 1 60); do docker exec restore-pg pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker exec restore-pg pg_isready -U postgres
          docker exec restore-pg createdb -U postgres restore_check
          echo "PG_BIN=$(scripts/backup/pgclient.sh "$PG_MAJOR")" >> "$GITHUB_ENV"
          echo "RESTORE_DATABASE_URL=postgres://postgres:restore@localhost:55432/restore_check" >> "$GITHUB_ENV"
      - name: Decrypt, restore, and hold it to the manifest
        run: scripts/backup/restore-run.sh "$RUNNER_TEMP/copy.tar.gpg" "$RUNNER_TEMP/restore-work"
      - name: Clean up (the container, the copy, the dump)
        if: always()
        run: |
          docker rm -f restore-pg >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/copy.tar.gpg" "$RUNNER_TEMP/restore-work" "$RUNNER_TEMP/newest.json"
      - name: Green again, so resolve the exception
        if: success()
        run: scripts/backup/alert.sh clear restore_check_failed "$ENVIRONMENT"
      - name: The check failed, so tell a person (ops exception and Sentry event)
        if: failure()
        run: |
          scripts/backup/alert.sh raise restore_check_failed "$ENVIRONMENT" "the weekly restore check of the $ENVIRONMENT database copy failed; see the run for which step"
