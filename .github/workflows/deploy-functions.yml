name: Deploy Supabase edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      staging:
        description: "Deploy this ref's kapso-brain as kapso-brain-test (for dry-run tests before merging; no webhook points at it)"
        type: boolean
        default: false

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hnjkietmwvkgbyrcnweq
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # verify_jwt per function comes from supabase/config.toml
      - name: Deploy all functions
        if: ${{ !inputs.staging }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy staging copy (kapso-brain-test)
        if: ${{ inputs.staging }}
        run: |
          cp -r supabase/functions/kapso-brain supabase/functions/kapso-brain-test
          supabase functions deploy kapso-brain-test --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
