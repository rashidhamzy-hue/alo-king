name: kapso-profile

# The WhatsApp business profile of a number (session 5e): about, description, address, category, website and the profile
# photo (whatsapp/business-profile.json, public/brand/whatsapp-profile.png), set by scripts/kapso/profile.ts through
# Kapso's Meta proxy (https://api.kapso.ai only). The photo goes as the handle of a Meta resumable upload (Kapso's media
# upload, meta_resumable_asset); without one the photo is left as it is. Meta's profile has no opening-hours field.
on:
  workflow_dispatch:
    inputs:
      phone_number_id:
        description: WhatsApp phone number id in Kapso
        default: "1378974041965966"
        required: true
      picture_handle:
        description: Handle of the profile photo from a Meta resumable upload (4::…); empty leaves the photo
        default: ""
        required: false

permissions:
  contents: read
  issues: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the profile
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          PHONE_NUMBER_ID: ${{ inputs.phone_number_id }}
          PROFILE_PICTURE_HANDLE: ${{ inputs.picture_handle }}
        run: |
          set -o pipefail
          node --experimental-strip-types --no-warnings scripts/kapso/profile.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ice breakers and commands (DECISIONS §39.15.11; whatsapp/conversational.json)
        id: conv
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          PHONE_NUMBER_ID: ${{ inputs.phone_number_id }}
        run: |
          set +e
          node --experimental-strip-types --no-warnings scripts/kapso/conversational.ts | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo "refused=$([ "$code" = "2" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ "$code" = "0" ] || [ "$code" = "2" ]
      - name: Owner issue when Meta refuses the ice breakers and commands through our token
        if: steps.conv.outputs.refused == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Owner (3 minutes): ice breakers and commands on the US test number (DECISIONS §39.15.11)"
          body="Customers shop by place and shop (DECISIONS §39.15.11). Four ice breakers and four commands make Order, Explore, My orders and Help one tap away. kapso-profile could not set them through Kapso (Meta or the proxy refused; the run's summary shows the reason).

          Steps (3 minutes, on a computer):
          1. Open business.facebook.com and pick the portfolio Memo Tiles.
          2. WhatsApp Manager -> Phone numbers -> +1 203-660-2328 -> Automations (Conversational components).
          3. Ice breakers (in this order): Order food / Explore shops near me / My orders / Talk to a person.
          4. Commands: order = Order from the shops that deliver to you; explore = Every shop near you, with photos, fees and times; orders = Your orders and where they are; help = Get help or talk to a person.
          5. Leave the welcome message off. Save.

          The bot already answers each of them. Run kapso-profile again afterwards: it reads them back and closes this issue.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          n=$(gh issue list --state open --label owner --search "ice breakers and commands in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$title" --label owner --body "$body"; fi
      - name: Close the ice-breaker issue once they are set
        if: steps.conv.outputs.refused == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --label owner --search "ice breakers and commands in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "kapso-profile set the ice breakers and commands and read them back."
          done
