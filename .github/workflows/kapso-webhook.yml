name: kapso-webhook

# Registers the Kapso webhook on every WhatsApp number of the Alo King project (the sandbox, and the US test number once
# it exists, DECISIONS §39.8) with one signing secret, stored straight into the Supabase function secret
# KAPSO_WEBHOOK_SECRET (scripts/kapso/webhooks.sh). Run by hand to rotate the secret; kapso-number runs it when a number
# is added. Safe to re-run. The secret is masked and never printed. Kapso only at https://api.kapso.ai (CLAUDE.md).
on:
  workflow_dispatch:
    inputs:
      phone_number_ids:
        description: Space-separated phone number ids (empty = every number in the Kapso project)
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: kapso-webhook
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      IDS: ${{ inputs.phone_number_ids }}
    steps:
      - uses: actions/checkout@v5
      # Pinned (DECISIONS §39.1): "latest" asked the GitHub API for the newest release on every run and hit its rate limit.
      - uses: supabase/setup-cli@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.120.0
      - name: Register every number with one secret
        run: |
          set -euo pipefail
          if [ -z "${IDS// }" ]; then
            IDS=$(curl -fsS --proto '=https' -H "X-API-Key: $KAPSO_API_KEY" "https://api.kapso.ai/platform/v1/whatsapp/phone_numbers?per_page=100" \
              | jq -r '.data[] | (.phone_number_id // .id)' | tr '\n' ' ')
          fi
          # shellcheck disable=SC2086
          scripts/kapso/webhooks.sh $IDS
