name: kapso-catalog

# DECISIONS §39.12: one Meta catalogue for the WhatsApp business account of the US test number, connected to it, with the
# cart and the catalogue icon in the chat header on (§39.15.13: customers never leave WhatsApp; the header catalogue stays
# until the Flow app is live; product messages fill the same cart; scripts/kapso/catalog.ts). It also records which route can write catalogue items, which
# the catalogue sync in dispatch uses. Runs on demand and daily (it changes nothing once everything is in place). When a step
# only Commerce Manager or WhatsApp Manager can do is left, it opens one `owner` issue with the click steps (§25).
# Staging only; Kapso only at https://api.kapso.ai; Graph API only with META_CATALOG_TOKEN.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      phone_number_id:
        description: WhatsApp phone number id in Kapso
        default: "1378974041965966"
        required: true
      catalog_id:
        description: Meta catalogue the owner made and connected (#181); "none" turns the direct check off
        default: "1684040949979106"
        required: false
      business_id:
        description: Meta business portfolio that owns it
        default: "131819648080461"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: kapso-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
      META_CATALOG_TOKEN: ${{ secrets.META_CATALOG_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PHONE_NUMBER_ID: ${{ inputs.phone_number_id || '1378974041965966' }}
      # Not secrets: the catalogue Rasheed made in Commerce Manager and its portfolio (#181).
      META_CATALOG_ID: ${{ inputs.catalog_id || '1684040949979106' }}
      META_BUSINESS_ID: ${{ inputs.business_id || '131819648080461' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Find or create the catalogue, connect it, cart on and catalogue icon on
        id: c
        run: |
          set -o pipefail
          DB_URL="$(scripts/staging-db-url.sh)"
          echo "::add-mask::$DB_URL"
          DB_URL="$DB_URL" pnpm exec tsx scripts/kapso/catalog.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Owner issue for a step only the owner can do
        if: steps.c.outputs.blocked != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED: ${{ steps.c.outputs.blocked }}
        run: |
          title="Owner (10 minutes): Meta catalogue for the US test number (DECISIONS §39.12)"
          body=$(scripts/kapso/catalog-owner-issue.sh "$BLOCKED")
          n=$(gh issue list --state open --label owner --search "$title in:title" --json number --jq '.[0].number // empty')
          # One issue; its steps follow the step that is left (create, or connect the catalogue that already exists).
          if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$title" --label owner --body "$body"; fi
      - name: Owner issue to show the catalogue icon when our token cannot (read back as hidden)
        if: steps.c.outputs.catalog_id != '' && steps.c.outputs.header == 'hidden'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Owner (2 minutes): show the catalogue icon in the chat header of the US test number (DECISIONS §39.15.13)"
          body="Customers shop inside WhatsApp (Rasheed, 17 October 18:24, DECISIONS §39.15.13): the catalogue icon in the chat header stays on, with the cart, until the Alo King Flow app is live. kapso-catalog read the icon back as off and could not switch it on with our token.

          Steps (2 minutes, on a computer):
          1. Open business.facebook.com and pick the portfolio Memo Tiles.
          2. WhatsApp Manager -> Account tools -> Catalogue.
          3. For the number +1 203-660-2328: switch ON \"Show catalogue icon in chat header\" and keep \"Add to cart\" ON. Save.

          kapso-catalog checks daily and closes this issue once the icon reads as shown.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          n=$(gh issue list --state open --label owner --search "show the catalogue icon in:title" --json number,title \
            --jq '[.[] | select(.title | test("show the catalogue icon in the chat header of the US test number"))][0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$title" --label owner --body "$body"; fi
      - name: Close the catalogue-icon issues that are done or no longer needed
        env:
          GH_TOKEN: ${{ github.token }}
          HEADER: ${{ steps.c.outputs.header }}
        run: |
          # §39.15.13 keeps the icon on, so a request to hide it is not wanted (#236).
          for n in $(gh issue list --state open --label owner --search "hide the catalogue icon in:title" --json number,title \
            --jq '.[] | select(.title | test("hide the catalogue icon in the chat header of the US test number")) | .number'); do
            gh issue close "$n" --reason "not planned" --comment "Not wanted: the catalogue icon stays on until the WhatsApp Flow app is live (DECISIONS §39.15.13)."
          done
          if [ "$HEADER" = "shown" ]; then
            for n in $(gh issue list --state open --label owner --search "show the catalogue icon in:title" --json number,title \
              --jq '.[] | select(.title | test("show the catalogue icon in the chat header of the US test number")) | .number'); do
              gh issue close "$n" --comment "kapso-catalog read the number's settings: catalogue icon on, cart on."
            done
          fi
      - name: Close the owner issue once the catalogue is connected
        if: steps.c.outputs.blocked == '' && steps.c.outputs.catalog_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG: ${{ steps.c.outputs.catalog_id }}
        run: |
          # Every open owner issue about this catalogue: the workflow's own and #181 (whose title differs).
          for n in $(gh issue list --state open --label owner --search "Meta catalogue in:title" --json number,title \
                       --jq '.[] | select(.title | test("Meta catalogue")) | .number'); do
            gh issue close "$n" --comment "Catalogue $CATALOG is in use for the account; products sync from the database.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          done
