name: kapso-catalog

# DECISIONS §39.12: one Meta catalogue for the WhatsApp business account of the US test number, connected to it, with the
# cart and the catalogue icons on (scripts/kapso/catalog.ts). It also records which route can write catalogue items, which
# the catalogue sync in dispatch uses. Runs on demand and daily (it changes nothing once everything is in place). When a step
# only Commerce Manager or WhatsApp Manager can do is left, it opens one `owner` issue with the click steps (§25).
# Staging only; Kapso only at https://api.kapso.ai; Graph API only with META_CATALOG_TOKEN.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      phone_number_id:
        description: WhatsApp phone number id in Kapso
        default: "1378974041965966"
        required: true
      catalog_id:
        description: Meta catalogue the owner made and connected (#181)
        default: "1684040949979106"
        required: false
      business_id:
        description: Meta business portfolio that owns it
        default: "131819648080461"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: kapso-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
      META_CATALOG_TOKEN: ${{ secrets.META_CATALOG_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PHONE_NUMBER_ID: ${{ inputs.phone_number_id || '1378974041965966' }}
      # Not secrets: the catalogue Rasheed made in Commerce Manager and its portfolio (#181).
      META_CATALOG_ID: ${{ inputs.catalog_id || '1684040949979106' }}
      META_BUSINESS_ID: ${{ inputs.business_id || '131819648080461' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Find or create the catalogue, connect it, turn on the cart and catalogue icons
        id: c
        run: |
          set -o pipefail
          DB_URL="$(scripts/staging-db-url.sh)"
          echo "::add-mask::$DB_URL"
          DB_URL="$DB_URL" pnpm exec tsx scripts/kapso/catalog.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Owner issue for a step only the owner can do
        if: steps.c.outputs.blocked != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED: ${{ steps.c.outputs.blocked }}
        run: |
          title="Owner (10 minutes): Meta catalogue for the US test number (DECISIONS §39.12)"
          body=$(scripts/kapso/catalog-owner-issue.sh "$BLOCKED")
          n=$(gh issue list --state open --label owner --search "$title in:title" --json number --jq '.[0].number // empty')
          # One issue; its steps follow the step that is left (create, or connect the catalogue that already exists).
          if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$title" --label owner --body "$body"; fi
      - name: Close the owner issue once the catalogue is connected
        if: steps.c.outputs.blocked == '' && steps.c.outputs.catalog_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG: ${{ steps.c.outputs.catalog_id }}
        run: |
          title="Owner (10 minutes): Meta catalogue for the US test number (DECISIONS §39.12)"
          n=$(gh issue list --state open --label owner --search "$title in:title" --json number --jq '.[0].number // empty')
          [ -z "$n" ] || gh issue close "$n" --comment "Catalogue $CATALOG is connected to the account; the cart and catalogue icons are on. Products sync from the database.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
