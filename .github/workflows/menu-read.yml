# Manual. Session FD1 (docs/DECISIONS.md, "FD1, 18 November 2026"): the menu reading run, on STAGING.
# Every menu photo taken on the console's Menus page is read by MODEL_FAST through the Anthropic Message Batches API at half price, one
# request per photo, into sections and dishes (names in Arabic and English, the price in USD or LBP as printed, sizes, options, add-ons).
# Each dish goes in through record_menu_reading as a PROPOSAL; a person approves every dish on the Menus page. No food fact is read from a menu.
# Money: capped at USD 2 (the input is clamped to 2; the worst case of the photos sent is estimated first, and no more are sent than the cap
# allows; photos left over are read by the next run) and recorded in model_costs (COST1, migration 0139). Nothing about a photo is printed.
# dry_run: reads the two invented menus in test/fixtures/menus/, writes nothing to the database but the cost, and prints what it read; it may
# run from any branch. A real run is from main only: staging must already have migrations 0245 to 0247 (0259 and 0260 for MENU2's sources).
# A batch that is still processing when the job ends keeps running at Anthropic; its id is printed, and a second run with batch_ids reads it.
# MENU2 (19 November 2026): every other kind of menu source goes through the same run. Before the reading, the run FETCHES what staff added on
# the Menus page: a link (a headless browser, Playwright's Chromium: the page, its section pages on the same site and its tabs, robots.txt
# obeyed, one fetch per page, never a sign-in; each page's text kept and its screenshot stored privately), a Word file and an Excel or CSV
# file (their text taken out). Pasted text and PDFs need no fetch. Then photos and source pages are read in ONE batch under the one cap.
# place + link: add that link for that place first (as the menu reading party: adding something to read approves nothing).
# AUTO1 (19 November 2026, "a person approves the rule; the rule approves the item"): a photo, a PDF and a screenshot are also read a second
# time in the same batch (names and prices only, no sight of the first reading); then automation_run_dishes (0263) approves every clean dish
# whose prices are verified (in the source text, or by the two readings agreeing), fixes praise words and cut-off descriptions first, and stamps
# a menu once nothing waits. Prices to confirm and anything flagged wait for a person. The place's hours and phone, when printed, are proposed.
# Secrets (repository secrets, never printed): SUPABASE_SERVICE_KEY, ANTHROPIC_API_KEY. The model is MODEL_FAST from wrangler.jsonc.
name: menu-read
on:
  workflow_dispatch:
    inputs:
      max_usd:
        description: "Dollar cap for this run (at most 2)"
        type: string
        default: "2"
      limit:
        description: "Only the first N photos waiting (empty = all)"
        type: string
        default: ""
      batch_ids:
        description: "Pick up batches already sent, comma-separated (msgbatch_...), instead of sending new ones (empty = send)"
        type: string
        default: ""
      dry_run:
        description: "Read the two invented menus only (nothing written but the cost)"
        type: boolean
        default: false
      place:
        description: "MENU2: a place's id (from its Menus page address), to add the link below to (empty = none)"
        type: string
        default: ""
      link:
        description: "MENU2: the web address of that place's menu (https://...), fetched and read in this run (empty = none)"
        type: string
        default: ""
      full_menu:
        description: "MENU2: the link is the place's whole menu (a later import then shows the dishes it no longer has)"
        type: boolean
        default: true
      fetch_only:
        description: "MENU2: fetch links and files only, read nothing (no model call)"
        type: boolean
        default: false
permissions: { contents: read }
defaults:
  run: { shell: bash }
concurrency:
  group: menu-read
  cancel-in-progress: false
env:
  SUPABASE_URL: https://lhgkvvdckwbfpdsftzqp.supabase.co
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Main only (a dry run may run from any branch)
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::menu-read runs from main only (staging must have migrations 0245 to 0247); choose branch main, or tick dry_run"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Chromium for menu links (MENU2; the version the lockfile's Playwright expects)
        if: ${{ !inputs.dry_run }}
        run: npx playwright install --with-deps chromium
      - name: Tests (the run against a scripted Batch API, the cap, the failures; MENU2's sources, crawl on a saved JavaScript menu page, review)
        env:
          MENU_BROWSER_REQUIRED: ${{ inputs.dry_run && '0' || '1' }}
        run: npx vitest run test/db/menu-read-fd1.test.ts test/db/menu2-sources.test.ts test/db/menu2-crawl.test.ts test/db/auto1.test.ts test/db/auto1-reading.test.ts
      - name: Read the menus
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_USD: ${{ inputs.max_usd || '2' }}
          LIMIT: ${{ inputs.limit }}
          BATCH_IDS: ${{ inputs.batch_ids }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          OUT_DIR: out/menus
          PLACE: ${{ inputs.place }}
          LINK: ${{ inputs.link }}
          FULL_MENU: ${{ inputs.full_menu }}
          FETCH_ONLY: ${{ inputs.fetch_only }}
        run: |
          export MODEL_FAST="$(node scripts/ci/wrangler-var.mjs MODEL_FAST)"
          node scripts/menus/read.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: menu-read, path: out/menus, retention-days: 30, if-no-files-found: ignore }
