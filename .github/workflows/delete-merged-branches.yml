# One-off (session H1, 14 Nov 2026). Deletes remote branches whose work is already on main. A branch is deleted only when
#   (a) its tip is an ancestor of main, or
#   (b) its tip is exactly the head commit of a pull request that was merged (squash or rebase merges leave no ancestry).
# Anything else, and any branch with an open pull request, is left alone and listed. `main` is never touched.
# Deleted again in the same cleanup pull request series.
name: delete-merged-branches
on:
  workflow_dispatch:
    inputs:
      branches:
        description: Space-separated branch names to consider
        type: string
        required: true
permissions: { contents: write, pull-requests: read }
defaults:
  run: { shell: bash }
jobs:
  delete:
    if: github.repository == 'rashidhamzy-hue/alo-king'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCHES: ${{ inputs.branches }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Delete the merged ones
        run: |
          set -uo pipefail
          for b in $BRANCHES; do
            case "$b" in main|HEAD|"") echo "- $b: never"; continue ;; esac
            if ! tip=$(git rev-parse --verify -q "refs/remotes/origin/$b"); then echo "- $b: not found"; continue; fi
            open=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$b" --jq 'length')
            if [ "$open" != "0" ]; then echo "- $b: KEPT, has an open pull request"; continue; fi
            why=""
            if git merge-base --is-ancestor "$tip" origin/main; then why="tip is on main"
            else
              n=$(gh api "repos/$REPO/pulls?state=closed&head=${REPO%%/*}:$b&per_page=100" --jq "[.[] | select(.merged_at != null and .head.sha == \"$tip\")] | length")
              [ "$n" != "0" ] && why="tip is the head of a merged pull request"
            fi
            if [ -z "$why" ]; then echo "- $b: KEPT, not shown to be merged"; continue; fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$b" >/dev/null 2>&1; then echo "- $b: deleted ($why)"; else echo "- $b: delete failed"; fi
          done | tee -a "$GITHUB_STEP_SUMMARY"
