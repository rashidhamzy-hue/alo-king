name: area-data

# The delivery area's outside data (DECISIONS §39.2), fetched from a runner because build sessions cannot reach
# Overpass or OpenRouteService:
#   * OSM landmarks and place names for the boundary's places (scripts/shouf/osm-fetch.mjs --boundary), into
#     supabase/seed/shouf/osm/ (© OpenStreetMap contributors, ODbL);
#   * the road distance from the nearest pilot merchant to each boundary place (scripts/shouf/area.mjs roads: ORS with
#     the ORS_API_KEY secret, the public OSRM server once that quota is spent), into
#     supabase/seed/places/shouf_delivery_road_km.csv; rows already committed there are kept.
# The result is pushed to a new branch `data/area-<run id>`; a build session reviews it and opens the `Data:` pull
# request. Run it again after the boundary file changes; run it on a branch (workflow_dispatch ref) to fill the rows
# that branch is missing.
on:
  workflow_dispatch:
    inputs:
      recompute:
        description: "Place ids to route again even though they have a road row, comma-separated (ORS and OSRM, the shorter wins)"
        required: false
        default: ""

permissions:
  contents: write

# `shell: bash` runs with -eo pipefail, so `node … | tee` fails the step when node fails.
defaults:
  run:
    shell: bash

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: OSM landmarks and place names for the boundary
        run: node scripts/shouf/osm-fetch.mjs supabase/seed/shouf/osm --boundary --margin-km 3 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Road distances from the nearest merchant (OpenRouteService)
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          RECOMPUTE: ${{ inputs.recompute }}
        run: |
          [ -n "${ORS_API_KEY:-}" ] || echo "ORS_API_KEY is not set: the public OSRM server only" | tee -a "$GITHUB_STEP_SUMMARY"
          RECOMPUTE="${RECOMPUTE// /}"
          [[ "${RECOMPUTE:-}" =~ ^[A-Z0-9,-]*$ ]] || { echo "recompute: place ids only"; exit 1; }
          node scripts/shouf/area.mjs roads supabase/seed/places/shouf_delivery_road_km.csv ${RECOMPUTE:+--recompute "$RECOMPUTE"} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push to a data branch
        env:
          BRANCH: data/area-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add supabase/seed/shouf/osm supabase/seed/places/shouf_delivery_road_km.csv 2>/dev/null || git add supabase/seed/shouf/osm
          git commit -m "Delivery area data from area-data run ${{ github.run_id }}" -m "OpenStreetMap (ODbL) landmarks and place names; OpenRouteService road distances."
          git push origin "$BRANCH"
          echo "pushed $BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
