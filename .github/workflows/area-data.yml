name: area-data

# The delivery area's outside data (DECISIONS §39.2), fetched from a runner because build sessions cannot reach
# Overpass or OpenRouteService:
#   * OSM landmarks and place names for the boundary's places (scripts/shouf/osm-fetch.mjs --boundary), into
#     supabase/seed/shouf/osm/ (© OpenStreetMap contributors, ODbL);
#   * the road distance from the nearest pilot merchant to each boundary place (scripts/shouf/area.mjs roads, needs the
#     ORS_API_KEY secret), into supabase/seed/places/shouf_delivery_road_km.csv.
# The result is pushed to a new branch `data/area-<run id>`; a build session reviews it and opens the `Data:` pull
# request. Run it again after the boundary file changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: OSM landmarks and place names for the boundary
        run: node scripts/shouf/osm-fetch.mjs supabase/seed/shouf/osm --boundary --margin-km 3 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Road distances from the nearest merchant (OpenRouteService)
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          if [ -z "${ORS_API_KEY:-}" ]; then
            echo "ORS_API_KEY is not set; no road distances (the proposal falls back to the straight line)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/shouf/area.mjs roads supabase/seed/places/shouf_delivery_road_km.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Push to a data branch
        env:
          BRANCH: data/area-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add supabase/seed/shouf/osm supabase/seed/places/shouf_delivery_road_km.csv 2>/dev/null || git add supabase/seed/shouf/osm
          git commit -m "Delivery area data from area-data run ${{ github.run_id }}" -m "OpenStreetMap (ODbL) landmarks and place names; OpenRouteService road distances."
          git push origin "$BRANCH"
          echo "pushed $BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
