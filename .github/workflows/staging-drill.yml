# Manual. Build plan 0.11: proves on STAGING the two recovery steps of docs/RUNBOOK.md that a normal deploy does not exercise:
#   1. roll the Worker back to its previous version, check it still answers, then deploy the current code again;
#   2. rotate one secret end to end (new webhook secret in the Worker and in Kapso, signed test event accepted).
# Deploying is proven by every run of deploy-staging. Nothing here can touch production.
name: staging-drill
on: workflow_dispatch
permissions: { contents: read }
defaults:
  run: { shell: bash }
concurrency: { group: deploy-staging, cancel-in-progress: false }   # shares the deploy lock: never run beside a deploy
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      PHONE_NUMBER_ID_CUSTOMER: "1378974041965966"
      PHONE_NUMBER_ID_OPS: "597907523413541"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Versions before
        run: npx wrangler deployments list --env staging 2>&1 | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Roll the Worker back one version
        id: rollback
        continue-on-error: true      # a failure is a finding for the runbook, not something to hide; the redeploy below still runs
        run: |
          npx wrangler rollback --env staging --message "staging drill" --yes 2>&1 | tee "$RUNNER_TEMP/rollback.log"
          echo "- Rollback command succeeded" >> "$GITHUB_STEP_SUMMARY"
      - name: Say what happened
        if: steps.rollback.outcome == 'failure'
        run: |
          echo "- **Rollback FAILED** (log above). The runbook must say what to do instead; see docs/RUNBOOK.md." >> "$GITHUB_STEP_SUMMARY"
          tail -5 "$RUNNER_TEMP/rollback.log" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
      - name: Worker still answers
        run: |
          sub=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          url="https://alo-king-gateway-staging.$sub.workers.dev"
          body=$(curl -sS -w ' [%{http_code}]' -X POST -d '{}' "$url/webhooks/kapso/customer")
          echo "after rollback: $body"; [ "$body" = "bad signature [401]" ]
          echo "- After the rollback the Worker answers: unsigned webhook gets 401" >> "$GITHUB_STEP_SUMMARY"
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"
      - name: Deploy the current code again
        run: npx wrangler deploy --env staging 2>&1 | tail -6
      - name: Rotate one secret end to end (the customer webhook secret)
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          ROTATE: "true"
        run: |
          scripts/ci/ensure-webhooks.sh
          echo "- Secret rotation proven: new webhook secret stored in the Worker and in Kapso, signed test event accepted" >> "$GITHUB_STEP_SUMMARY"
      - name: Versions after
        run: npx wrangler deployments list --env staging 2>&1 | tail -12 | tee -a "$GITHUB_STEP_SUMMARY"
