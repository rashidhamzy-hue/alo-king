name: data-branch-cleanup

# Deletes the data/places-, data/area- and data/menu-harvest-<run id> branches the data workflows leave behind once a build session has
# reviewed them. Cloud sessions cannot delete branches they did not create, so the deletion runs here.
# - workflow_dispatch with all=true: delete every such branch (run it after the seed PR merges).
# - daily: delete those branches whose last commit is older than three days.
# Only those data branches are ever touched.
on:
  workflow_dispatch:
    inputs:
      all:
        description: Delete every data/places-, data/area- and data/menu-harvest- branch
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete data branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALL: ${{ inputs.all || 'false' }}
        run: |
          cutoff=$(date -u -d '3 days ago' +%s)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' |
            grep -E '^data/(places|area|menu-harvest)-[0-9]+$' |
            while read -r branch; do
              if [ "$ALL" != "true" ]; then
                date=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${branch}" --jq '.commit.committer.date')
                [ "$(date -u -d "$date" +%s)" -lt "$cutoff" ] || continue
              fi
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "deleted ${branch}" | tee -a "$GITHUB_STEP_SUMMARY"
            done
