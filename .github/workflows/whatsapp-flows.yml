name: whatsapp-flows

# DECISIONS §12, §32.5 and §39.8: Flowso validates every Flow in whatsapp/flows/ and replays its scenarios, then
# scripts/kapso/flows.ts uploads each one to Kapso on a WhatsApp number (a new draft, or a new version of an existing
# draft, found by its name alo_<flow>_<lang>), sets up Flow encryption on the number's business account, and with
# `publish` publishes the drafts and switches each Flow on (a dated flows_enabled row on staging). `send_tests` sends one
# test of each live Flow to the owner phone that wrote to the number in the last 24 hours. Kapso only at
# https://api.kapso.ai. (Run 38762070639 failed because `flowso deploy --json` printed more than JSON.)
on:
  workflow_dispatch:
    inputs:
      phone_number_id:
        description: WhatsApp phone number id in Kapso (the sandbox until cut-over)
        default: "1378974041965966"
        required: true
      publish:
        description: Publish the drafts after uploading, and switch each published Flow on (staging)
        type: boolean
        default: false
      send_tests:
        description: Send one test of each live Flow to the owner phone that wrote to this number in the last 24 hours
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate and replay every scenario
        run: |
          for f in whatsapp/flows/*.json; do
            name=$(basename "$f" .json); base=${name%.*}
            pnpm exec flowso validate "$f" --json >/dev/null
            pnpm exec flowso test "$f" --scenario "whatsapp/flows/scenarios/$base.json" --json >/dev/null
            echo "ok $name"
          done
      - name: Upload, encrypt, publish and test
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PHONE_NUMBER_ID: ${{ inputs.phone_number_id }}
          PUBLISH: ${{ inputs.publish }}
          SEND_TESTS: ${{ inputs.send_tests }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PHONE_NUMBER_ID" =~ ^[0-9]{6,20}$ ]] || { echo "::error::bad phone number id"; exit 1; }
          DB_URL="$(scripts/staging-db-url.sh)"
          echo "::add-mask::$DB_URL"
          DB_URL="$DB_URL" pnpm exec tsx scripts/kapso/flows.ts | tee -a "$GITHUB_STEP_SUMMARY"
