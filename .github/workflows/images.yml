# Manual. Build plan 5.17 (session P1): fetch a proposed picture for each catalog item on STAGING.
# The build environment cannot reach Open Food Facts or search sites, so the fetch runs here (scripts/images/fetch-images.mjs).
# Open Food Facts always runs. Brand-site and web image search run only when the repository secret BRAVE_SEARCH_API_KEY exists
# (docs/DECISIONS.md "Product picture search"). Pictures land in the private `media` bucket as `proposed`: a person approves
# them on the console page (3.18). Nothing here makes a picture visible to a customer.
# Session PIX: search hits are filed as public-page pictures (founder decision, docs/DECISIONS.md), the fastest sellers go first, a picture
# another item already has is refused before the paid check, and the last step writes the queue report (a candidate or a named reason
# for every active item; artifact `pictures-report`). Spend: the model's cap is `max_usd`; the search is about USD 0.005 a request and is
# counted in the run summary (it is not a model call, so the meter does not see it).
# Secrets used (repository secrets, never printed): SUPABASE_SERVICE_KEY, ANTHROPIC_API_KEY, BRAVE_SEARCH_API_KEY (optional).
name: images
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Only the first N items still needing a picture (empty = all)
        type: string
        default: ""
      force:
        description: Also items that already have a usable picture (never touches approved ones; adds a new proposal)
        type: boolean
        default: false
      no_search:
        description: Open Food Facts only, even if the search secret exists
        type: boolean
        default: false
      retry_all:
        description: Also items an earlier run finished with nothing (use after the search or the check changed)
        type: boolean
        default: false
      from_list:
        description: "From list (PIX2): download exactly the pictures in data/pictures/candidates.csv, run the same checks, queue the passes. No search, no Open Food Facts lookup."
        type: boolean
        default: false
      max_usd:
        description: Dollar cap for the run's model calls (the picture check). The run stops starting new items when it passes it. Use 3 for a from-list run.
        type: string
        default: "2"
      import_release:
        description: "Import (PIX4): the tag of a pre-release holding the founder's pictures (for example pictures-1). Downloads its .zip files and image_fetch_report*.csv into a new folder outside the repository, checks every picture by script (no model, no cost), stores 1000 px WebP files and queues them for approval (Console, Photos). The other inputs are ignored."
        type: string
        default: ""
      import_dry_run:
        description: "Import only: check and convert everything but upload and write nothing (no database needed)."
        type: boolean
        default: false
permissions: { contents: read }
defaults:
  run: { shell: bash }
concurrency:
  group: images
  cancel-in-progress: false
env:
  SUPABASE_URL: https://lhgkvvdckwbfpdsftzqp.supabase.co
jobs:
  fetch:
    if: ${{ inputs.import_release == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      RUN_ID: ${{ github.run_id }}
      # COST1: counted in model_costs (0139), stopped at this cap.
      MODEL_COST_CAP_USD: ${{ inputs.max_usd || '2' }}
      MODEL_COST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install the picture tools (sharp lives in scripts/images only)
        run: npm ci --prefix scripts/images
      - name: Tests (the pipeline against the real migrations, and real resizing)
        run: npx vitest run scripts/images test/db/product-images.test.ts
      - name: Which sources will run
        run: |
          if [ "${{ inputs.from_list }}" = "true" ]; then
            echo "- sources: the list data/pictures/candidates.csv only (from_list ticked)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$BRAVE_SEARCH_API_KEY" ] && [ "${{ inputs.no_search }}" != "true" ]; then
            echo "- sources: Open Food Facts, brand sites, web image search (Brave)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- sources: Open Food Facts only (secret BRAVE_SEARCH_API_KEY missing, or no_search ticked)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fetch, check, resize, store, propose
        env:
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
          NO_SEARCH: ${{ inputs.no_search }}
          RETRY_ALL: ${{ inputs.retry_all }}
          FROM_LIST: ${{ inputs.from_list }}
        run: |
          export MODEL_FAST=$(node scripts/ci/wrangler-var.mjs MODEL_FAST)
          args=()
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && args+=(--limit "$LIMIT")
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$NO_SEARCH" = "true" ] && args+=(--no-search)
          [ "$RETRY_ALL" = "true" ] && args+=(--retry-all)
          [ "$FROM_LIST" = "true" ] && args+=(--from-list data/pictures/candidates.csv)
          node scripts/images/fetch-images.mjs "${args[@]}"
      - name: The pictures are private, and the intake list
        run: node scripts/images/prove-private.mjs
      - name: The queue report (a candidate or a named reason for every active item)
        if: always()
        env:
          FROM_LIST: ${{ inputs.from_list }}
        run: node scripts/images/report.mjs
      - uses: actions/upload-artifact@v4
        with: { name: photograph-at-intake, path: intake-list.json, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pictures-report, path: "pictures-report.*\npictures-run.json", retention-days: 30, if-no-files-found: ignore }

  # PIX4. The founder's pictures from a release into the approval queue. Free: no model call. The release's files are untrusted data: they are
  # downloaded into a new empty folder under the runner's temp directory (never the repository), unzipped there, and only read by the script.
  import:
    if: ${{ inputs.import_release != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RUN_ID: ${{ github.run_id }}
      TAG: ${{ inputs.import_release }}
      DRY: ${{ inputs.import_dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install the picture tools (sharp lives in scripts/images only)
        run: npm ci --prefix scripts/images
      - name: Tests (the checks on small pictures; the queue against the real migrations)
        run: npx vitest run scripts/images/test/import.test.mjs test/db/pix4-queue.test.ts
      - name: Download the release into a new empty folder, and unzip it there
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,60}$ ]] || { echo "bad tag"; exit 2; }
          root="$RUNNER_TEMP/release-$GITHUB_RUN_ID"
          mkdir "$root"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$root" --pattern '*.zip' --pattern 'image_fetch_report*.csv'
          n=0
          for z in "$root"/*.zip; do
            [ -e "$z" ] || continue
            n=$((n+1))
            total=$(unzip -l "$z" | tail -1 | awk '{print $1}')
            [ "${total:-0}" -lt 600000000 ] || { echo "zip too large"; exit 2; }
            mkdir "$root/unzipped-$n"
            unzip -q "$z" -d "$root/unzipped-$n"
          done
          echo "RELEASE_DIR=$root" >> "$GITHUB_ENV"
          echo "zips unzipped: $n; csv: $(ls "$root"/image_fetch_report*.csv 2>/dev/null | wc -l)"
      - name: Check, convert, store and queue (Console, Photos)
        run: |
          args=(--dir "$RELEASE_DIR" --release "$TAG" --out "$RUNNER_TEMP/pictures-import")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          export SUPABASE_URL
          node scripts/images/import-release.mjs "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pictures-import, path: "${{ runner.temp }}/pictures-import", retention-days: 30, if-no-files-found: ignore }
