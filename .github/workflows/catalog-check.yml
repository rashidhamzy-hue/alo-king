# Manual. CAT2: the catalogue message checked live on STAGING (scripts/qa/catalog-check.mjs): «الكتالوج» enters the staging Worker, which
# answers through its gateway and Kapso, for real. With `tester`, the tester who wrote most recently (within 23 hours, so the window is
# open) receives one catalogue message (Kapso refuses a closed window); no number is an input or printed. Without it, a fiction-range scripted tester proves the Worker's side only.
name: catalog-check
on:
  workflow_dispatch:
    inputs:
      tester:
        description: "Send to the tester who wrote most recently (within 23 hours); off: the fiction-range scripted tester"
        type: boolean
        default: false
permissions: { contents: read }
defaults:
  run: { shell: bash }
concurrency: { group: catalog-check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TESTER: ${{ inputs.tester }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: 3.1.0 }
      - name: Connection string (session pooler)
        run: |
          supabase link --project-ref lhgkvvdckwbfpdsftzqp
          test -s supabase/.temp/pooler-url || { echo "no pooler url after link"; exit 1; }
          echo "DATABASE_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - name: The check
        run: node scripts/qa/catalog-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
