name: route-matrix

# Shop → place road distances (DECISIONS §39.15.1): the browse screens and the checkout fallback read
# public.shop_place_routes, so routing never blocks an order. Fills the pairs shop_place_routes_needed() returns (new
# orderable or demo shops, new delivered-to places, a shop whose pin moved) with OpenRouteService Matrix, 25 × 25 per
# request, within what the day's budget leaves below the checkout reserve. A run with nothing to do sends no request.
# The budget job opens or updates one `owner` issue (information only) when a day passes the checkout reserve.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "active: orderable and demo shops; all: every Shouf merchant in the pilot villages"
        required: false
        default: active
        type: choice
        options: [active, all]
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read

concurrency:
  group: route-matrix
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Refuse anything but the staging project
        run: '[ "$SUPABASE_PROJECT_REF" = "tzugbbatfbvrfzxuacqx" ] || { echo "::error::only alo-king-staging"; exit 1; }'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute the missing shop → place distances
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          SCOPE: ${{ inputs.scope || 'active' }}
        run: |
          set -o pipefail
          DB_URL="$(scripts/staging-db-url.sh)"
          echo "::add-mask::$DB_URL"
          DB_URL="$DB_URL" env -u SUPABASE_ACCESS_TOKEN -u SUPABASE_DB_PASSWORD \
            node --experimental-strip-types --no-warnings scripts/routing/route-matrix.ts | tee -a "$GITHUB_STEP_SUMMARY"

  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job writes issues; the matrix job installs packages and runs third-party code.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Refuse anything but the staging project
        run: '[ "$SUPABASE_PROJECT_REF" = "tzugbbatfbvrfzxuacqx" ] || { echo "::error::only alo-king-staging"; exit 1; }'
      - name: Today's OpenRouteService use against the budget
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          DB_URL="$(scripts/staging-db-url.sh)"
          echo "::add-mask::$DB_URL"
          row=$(psql "$DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "
            select coalesce(u.requests, 0), coalesce(u.checkout, 0), coalesce(u.matrix, 0), coalesce(u.refused, 0),
              public.config_numeric('ors_daily_budget')::int,
              floor(public.config_numeric('ors_daily_budget') * public.config_numeric('ors_checkout_reserve_pct') / 100)::int
            from (select (now() at time zone 'utc')::date as d) t
            left join public.routing_usage u on u.day = t.d")
          IFS='|' read -r used checkout matrix refused budget reserve <<<"$row"
          echo "OpenRouteService today (UTC): $used of $budget requests (checkout $checkout, route-matrix $matrix, refused $refused; checkout-only from $reserve)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$used" -ge "$reserve" ] || exit 0
          title="Routing: OpenRouteService passed its checkout reserve today (information only)"
          body=$(printf '%s\n' \
            "**Information only (DECISIONS §39.15.1). Nothing to do unless it happens every day.**" \
            "" \
            "$(date -u +%F): $used of $budget OpenRouteService requests used (checkout $checkout, route-matrix $matrix; $refused calls not made)." \
            "Past $reserve requests only checkout may call OpenRouteService; at $budget checkout quotes from the shop → place distances (orders still go through, recorded as \`route_source = place_fallback\`)." \
            "" \
            "If this recurs, the options are a second free OpenRouteService key or its paid plan; a build session sets either up." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label owner --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            # One comment a day at most: a later run of the same day only refreshes nothing.
            last=$(gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json comments,body --jq '(.comments[-1].body // .body)')
            if grep -q "^$(date -u +%F):" <<<"$last"; then echo "already reported today"; exit 0; fi
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label owner --title "$title" --body "$body"
          fi
