# The website (apps/web), STAGING only. Runs after deploy-staging on main (so the migrations the pages read are applied first) and by hand.
# It never runs for a pull request, and never for a fork: the trigger is this repository's own pushes to main (through deploy-staging, whose own
# rule is "a push to this repository's main") or a person pressing the button. deploy-staging is itself started by ci's workflow_run, so the
# event on ITS run is `workflow_run` (not `push`: the first version of this file tested for `push` and every run was skipped); a deploy-staging
# pressed by hand has event `workflow_dispatch` and does not start this one (press this workflow instead).
#   build   astro build (Astro with the Cloudflare adapter), tests first when run by hand
#   deploy  wrangler deploy of the Worker alo-king-web-staging
#   secrets SUPABASE_URL, SUPABASE_ANON_KEY and WEB_CHANNEL_JWT (a token whose role claim is web_channel; never the service key)
#   check   apps/web/scripts/smoke.sh: pages from the real database with no JavaScript, the three spellings of labneh, page weight
# The token needs the project's JWT secret. The Management API normally returns it; if it does not, the run stops with the exact steps in its
# summary (apps/web/scripts/token.sh): the founder copies the secret once into the repository secret SUPABASE_JWT_SECRET.
#
# Repository secrets used (never printed): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_ACCESS_TOKEN, and optionally SUPABASE_JWT_SECRET.
name: web
on:
  workflow_dispatch:
  workflow_run:
    workflows: [deploy-staging]
    types: [completed]
    branches: [main]
permissions: { contents: read }
defaults:
  run: { shell: bash }
concurrency:
  group: web-staging
  cancel-in-progress: false
env:
  SUPABASE_PROJECT_REF: lhgkvvdckwbfpdsftzqp
  SUPABASE_URL: https://lhgkvvdckwbfpdsftzqp.supabase.co
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
  WRANGLER_SEND_METRICS: "false"
  ASTRO_TELEMETRY_DISABLED: "1"
jobs:
  changes:
    # After deploy-staging on main only: did this merge touch anything the website is built from? Skipped (and free) for a hand run.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.f.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}", fetch-depth: 2 }
      - id: f
        run: |
          set -euo pipefail
          deploy=true; why="no readable parent: deploy"
          if git rev-parse --verify -q HEAD^1 >/dev/null; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files.txt"
            if grep -Eq '^(apps/web/|packages/(commerce|ui)/|package(-lock)?\.json$|tsconfig\.json$|\.github/workflows/web\.yml$)' "$RUNNER_TEMP/files.txt"; then why="website paths changed"
            else deploy=false; why="no website path changed"; fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "- website deploy: $deploy ($why)" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.deploy == 'true') && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'
        && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tests (the same ones CI runs; here too because a hand-run deploy may come from a branch; not after deploy-staging, which follows ci)
        if: github.event_name != 'workflow_run'
        run: npx tsc --noEmit && npx vitest run test/web test/db/web-catalog-web1.test.ts
      - name: Build the website (staging)
        working-directory: apps/web
        env: { CLOUDFLARE_ENV: staging }
        run: npx astro build
      - name: Deploy the Worker
        id: deploy
        working-directory: apps/web
        run: |
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/web-deploy.log"
          url=$(scripts/url.sh)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- Website deployed: $url (from ${GITHUB_REF_NAME}, $(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
      - name: Worker secrets (the project address, its public key, and a token for the role web_channel; never the service key)
        working-directory: apps/web
        run: |
          umask 077
          scripts/token.sh "$RUNNER_TEMP/web-token.json"
          jq --arg u "$SUPABASE_URL" '. + {SUPABASE_URL: $u}' "$RUNNER_TEMP/web-token.json" > "$RUNNER_TEMP/web-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/web-secrets.json" --name alo-king-web-staging 2>&1 | sed -E 's/(key|token|secret|jwt)[^ ]*/\1 (hidden)/Ig'
          rm -f "$RUNNER_TEMP/web-token.json" "$RUNNER_TEMP/web-secrets.json"
          echo "- Worker secrets set: SUPABASE_URL, SUPABASE_ANON_KEY, WEB_CHANNEL_JWT" >> "$GITHUB_STEP_SUMMARY"
      - name: Live check (real database, no JavaScript, labneh, page weight)
        env:
          SITE_URL: ${{ steps.deploy.outputs.url }}
        run: apps/web/scripts/smoke.sh "$SITE_URL" | tee -a "$GITHUB_STEP_SUMMARY"
