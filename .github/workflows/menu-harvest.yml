name: menu-harvest

# Full menus for the Shouf merchants, as drafts the merchant confirms (DECISIONS §39.4), fetched from a runner because
# build sessions cannot reach these hosts:
#   * source 2: every merchant's menu link (Omega, menutigr, qr-order.online, leb.directory and plain sites; never
#     Instagram or Facebook) is opened in headless Chromium and read by scripts/menus/ into
#     supabase/seed/shouf/harvest/05_harvested_menus.json plus harvest-report.md;
#   * source 3 (input `photos`, needs Anthropic API credit): the seed photos are sorted by the photo model and the menu
#     photos read by the menu model into photo_classes.csv and 06_photo_menus.json. Without credit it says so and
#     writes nothing.
# The drafts, the report and harvest-shapes.md (what each page loaded, as URLs and JSON key skeletons, no values) are
# pushed to a new branch `data/menu-harvest-<run id>`; a build session opens the `Data:` pull request with the drafts.
# The raw captures stay on the runner: a platform's answer can carry the branch's own contact details. Nothing here
# touches the database. Run it on a branch (workflow_dispatch ref) to try adapters before they merge.
on:
  workflow_dispatch:
    inputs:
      photos:
        description: Also read the seed photos (needs Anthropic API credit; about $10 for the whole set)
        type: boolean
        default: false
      photo_limit:
        description: At most this many photos to classify (empty for all)
        type: string
        default: ""
      only:
        description: Only these merchants (place ids, comma separated); their menus are merged into the committed drafts and the shapes file gets redacted samples
        type: string
        default: ""

permissions:
  contents: write

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

# `shell: bash` runs with -eo pipefail, so `node … | tee` fails the step when node fails.
defaults:
  run:
    shell: bash

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Chromium and pdftotext read untrusted pages: no write credentials on disk until the push step.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: pdftotext
        run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Source 2, menu links (capture, then read)
        env:
          ONLY: ${{ inputs.only }}
        run: |
          node --experimental-strip-types --no-warnings scripts/menus/harvest.ts capture harvest-raw
          node --experimental-strip-types --no-warnings scripts/menus/harvest.ts parse harvest-raw supabase/seed/shouf/harvest | tee -a "$GITHUB_STEP_SUMMARY"
          cat supabase/seed/shouf/harvest/harvest-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Source 3, seed photos (Anthropic API credit)
        if: inputs.photos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PHOTO_LIMIT: ${{ inputs.photo_limit }}
        run: |
          DB_URL="$(scripts/staging-db-url.sh)"
          echo "::add-mask::$DB_URL"
          keys=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true")
          key=$(jq -r '([.[] | select(.type == "secret")][0].api_key) // ([.[] | select(.name == "service_role")][0].api_key) // empty' <<<"$keys")
          [ -n "$key" ] || { echo "no service key"; exit 1; }
          echo "::add-mask::$key"
          [ -n "$PHOTO_LIMIT" ] || unset PHOTO_LIMIT
          DB_URL="$DB_URL" SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co" SUPABASE_SERVICE_KEY="$key" \
            node --experimental-strip-types --no-warnings scripts/menus/photos.ts supabase/seed/shouf/harvest | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push to a data branch
        env:
          BRANCH: data/menu-harvest-${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add supabase/seed/shouf/harvest
          git commit -m "Menus harvested by menu-harvest run ${{ github.run_id }}" -m "DECISIONS §39.4 sources 2-3: drafts the merchant confirms."
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "$BRANCH"
          echo "pushed $BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
