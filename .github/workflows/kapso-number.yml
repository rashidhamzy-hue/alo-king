name: kapso-number

# DECISIONS §39.8, owner issue #170: when the US test number appears in the Kapso project "Alo King", record it in
# whatsapp_numbers (role test), register the eu-central-1 webhook on every number with one secret, submit the WhatsApp
# templates (supabase/functions/_shared/whatsapp-templates.ts) to Meta, upload the Flows, and close #170. Every day it
# mirrors Meta's template statuses into public.whatsapp_templates (an approval or a rejection is an ops note). While the
# project has only the sandbox it changes nothing. Staging only; Kapso only at https://api.kapso.ai.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      owner_issue:
        description: The owner issue to close once the number is connected
        default: "170"
        required: false

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: kapso-number
  cancel-in-progress: false

jobs:
  number:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record the number, submit and sync the templates
        id: n
        run: |
          set -o pipefail
          DB_URL="$(scripts/staging-db-url.sh)"
          echo "::add-mask::$DB_URL"
          DB_URL="$DB_URL" pnpm exec tsx scripts/kapso/number.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: supabase/setup-cli@v1
        if: steps.n.outputs.new_number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.120.0
      - name: Webhooks on every number, one secret
        if: steps.n.outputs.new_number != ''
        env:
          IDS: ${{ steps.n.outputs.numbers }}
        run: |
          # shellcheck disable=SC2086
          scripts/kapso/webhooks.sh $IDS
      - name: Upload the Flows to the new number, then close the owner issue
        if: steps.n.outputs.new_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PN: ${{ steps.n.outputs.new_number }}
          ISSUE: ${{ inputs.owner_issue || '170' }}
        run: |
          gh workflow run whatsapp-flows.yml --ref "${GITHUB_REF_NAME}" -f phone_number_id="$PN"
          [[ "$ISSUE" =~ ^[0-9]+$ ]] && gh issue close "$ISSUE" --comment "The US test number ($PN) is connected: webhook registered (eu-central-1), templates submitted to Meta, Flows uploading (whatsapp-flows run). Statuses sync daily into whatsapp_templates.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" || true
