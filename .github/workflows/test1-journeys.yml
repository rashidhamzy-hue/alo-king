# Manual. TEST1: the friends' test journeys on STAGING, by scripted customers (scripts/qa/test1-journeys.mjs): a stranger refused, a typed
# order and its walk, a voice note, a catalogue cart, a Safa Chicken order with a required choice, "where's my order?", the feedback
# question, and a website order confirmed on WhatsApp. Nothing is sent to a real phone (the scripted customers are probe parties); their
# invented numbers are on the tester list only for the run. Spend: the live model reads three orders (cents).
name: test1-journeys
on:
  workflow_dispatch:
    inputs:
      set:
        description: "Which six fresh scripted customers (5 to 9): a later run takes the next digit, so no earlier chat carries over"
        type: string
        default: "5"
      only:
        description: "Optional: only these journeys, comma-separated (stranger, typed, voice, cart, food, web); empty runs all six"
        type: string
        default: ""
permissions: { contents: read }
defaults:
  run: { shell: bash }
concurrency: { group: test1-journeys, cancel-in-progress: false }
jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      WEB_URL: https://alo-king-web-staging.rashid-hamzy.workers.dev
      JOURNEY_SET: ${{ inputs.set }}
      JOURNEYS: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: A headless browser for the website journey
        run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with: { version: 3.1.0 }
      - name: Connection string (session pooler)
        run: |
          supabase link --project-ref lhgkvvdckwbfpdsftzqp
          test -s supabase/.temp/pooler-url || { echo "no pooler url after link"; exit 1; }
          # The file holds the user and host but no password; PGPASSWORD supplies it (postgres.js reads it too).
          echo "DATABASE_URL=$(cat supabase/.temp/pooler-url)" >> "$GITHUB_ENV"
      - name: The journeys
        run: node scripts/qa/test1-journeys.mjs | tee -a "$GITHUB_STEP_SUMMARY"
