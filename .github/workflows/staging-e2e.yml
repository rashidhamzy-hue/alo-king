name: staging-e2e

# Claude Code tests the bot itself (DECISIONS §36). Signed, Kapso-shaped webhook events go to the deployed
# whatsapp-webhook on alo-king-staging; the bot answers simulated +999 numbers, which are recorded in sim_outbox
# instead of being sent to Kapso. Scenarios in tests/e2e/scenarios/*.yaml assert the replies and the database.
# Runs after every staging deploy (called from ci.yml) and on demand. Staging only; real numbers are never touched.
#
# The signing secret: Kapso's own webhook secret is generated by kapso-webhook.yml and lives only as a function
# secret, so each run makes a one-time secret E2E_WEBHOOK_SECRET, sets it on the functions, and removes it at the
# end. The webhook accepts it only for +999 numbers.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated scenario names (default all)
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: staging-e2e
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

jobs:
  e2e:
    name: scenarios against alo-king-staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT_DIR: e2e-out
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/lebanon
      - name: Refuse anything but the staging project
        run: '[ "$SUPABASE_PROJECT_REF" = "tzugbbatfbvrfzxuacqx" ] || { echo "::error::only alo-king-staging"; exit 1; }'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: One-time signing secret for this run
        run: |
          set -euo pipefail
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "E2E_WEBHOOK_SECRET=$secret" >/dev/null
          echo "E2E_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
          echo "WEBHOOK_URL=https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/whatsapp-webhook?forceFunctionRegion=eu-central-1" >> "$GITHUB_ENV"
      - name: Wait until the webhook knows the secret (a signed non-simulator body is refused with 403, not 401)
        run: |
          for i in $(seq 1 30); do
            sig=$(printf '{}' | openssl dgst -sha256 -hmac "$E2E_WEBHOOK_SECRET" -hex | sed 's/^.* //')
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK_URL" -H 'content-type: application/json' \
              -H "x-webhook-signature: $sig" -d '{}')
            echo "attempt $i: $code"
            [ "$code" = "403" ] && exit 0
            sleep 4
          done
          echo "::error::the webhook never accepted the e2e secret (is the whatsapp-webhook from this commit deployed?)"
          exit 1
      - name: Run the scenarios
        id: run
        continue-on-error: true
        run: |
          DB_URL="$(scripts/staging-db-url.sh)"
          echo "::add-mask::$DB_URL"
          export DB_URL
          pnpm exec tsx tests/e2e/run.ts
      - name: Remove the one-time secret
        if: always()
        run: echo y | supabase secrets unset --project-ref "$SUPABASE_PROJECT_REF" E2E_WEBHOOK_SECRET >/dev/null || echo "::warning::could not unset E2E_WEBHOOK_SECRET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-transcripts
          path: e2e-out
          if-no-files-found: ignore
      - name: Open, update or close the e2e issue
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.run.outcome }}
          SHA: ${{ github.sha }}
        run: |
          gh label create e2e --color B60205 --description "Staging e2e scenario failure (DECISIONS §36)" 2>/dev/null || true
          open=$(gh issue list --label e2e --state open --json number --jq '.[0].number // empty')
          if [ "$OUTCOME" = "success" ]; then
            [ -n "$open" ] && gh issue close "$open" --comment "All scenarios pass again: $RUN_URL" || true
            exit 0
          fi
          {
            echo "### staging-e2e failed"
            echo
            echo "Run: $RUN_URL (transcripts are in the \`e2e-transcripts\` artifact)"
            echo
            if [ -f e2e-out/summary.md ]; then head -c 60000 e2e-out/summary.md; else echo "The runner stopped before any scenario finished; see the run log."; fi
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > issue.md
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue.md
          else
            gh issue create --label e2e --title "e2e: staging scenarios are failing" --body-file issue.md
          fi
      - name: Fail the job when a scenario failed
        if: steps.run.outcome != 'success'
        run: exit 1
