name: friends-path
description: >
  Session 5g part E (DECISIONS §39.15.3), on the native path since session 5h (§39.15.13): the whole path a friend takes,
  three times, from a Dubai, a Riyadh and a Beirut pin: an ice breaker, the demo address, the craving list and Popular near
  you, a shop from the website opening with its product message, the native cart, the checkout, and the demo autopilot
  playing the shop to delivered. No message ever sends the friend to a website.
personas:
  dubai: { role: customer, cc: "971", name: "Sim Friend Dubai" }
  riyadh: { role: customer, cc: "966", name: "Sim Friend Riyadh" }
  beirut: { role: customer, cc: "961", name: "Sim Friend Beirut" }
  merchant: { role: merchant }
steps:
  - note: >
      a delivery-only demo shop open now and for the next 45 minutes (the three paths) that delivers to the Baakleen demo
      address and opens with a product message on the simulated catalogue, and one item of its first product section with no
      choices
    db:
      - sql: >
          select v.slug, i.id as item, i.price_usd
          from public.shop_place_routes r join public.vendors v on v.id = r.vendor_id
          left join public.vendor_ops op on op.vendor_id = v.id
          cross join lateral (select public.catalog_shop_menu(v.id, 'sim') as m) cm
          join lateral (select i.id, i.price_usd
                        from jsonb_array_elements(cm.m -> 'sections' -> 0 -> 'products') p
                        join public.menu_items i on i.id = (p ->> 'retailer_id')::uuid
                        where i.pricing_unit = 'each' and i.price_usd > 0
                          and not exists (select 1 from public.menu_option_groups g where g.item_id = i.id)
                        limit 1) i on true
          where r.place_id = 'LB-CHF-BAAKLINE' and app_private.vendor_is_demo(v.id) and v.orderable and v.delivery_enabled
            and not v.pickup_enabled and app_private.vendor_open_at(v.id)
            and app_private.vendor_open_at(v.id, now() + interval '45 minutes') and not public.vendor_is_paused(v.id)
            and r.road_km <= coalesce(v.delivery_radius_km, public.max_delivery_km())
            and (cm.m ->> 'shown')::int >= coalesce(public.config_value('browse_min_catalog_items')::int, 6)
            and coalesce(op.min_order_usd, 0) <= 2 * i.price_usd
          order by r.road_km limit 1
        row: { slug: "~." }
        save: { slug: slug, item: item, price: price_usd }
  - include: { part: friend-path, as: dubai, where: Dubai, lat: 25.2048, lon: 55.2708 }
  - include: { part: friend-path, as: riyadh, where: Riyadh, lat: 24.7136, lon: 46.6753 }
  - include: { part: friend-path, as: beirut, where: Beirut, lat: 33.8938, lon: 35.5018 }
  - include: { part: friend-after, as: dubai }
  - include: { part: friend-after, as: riyadh }
  - include: { part: friend-after, as: beirut }
