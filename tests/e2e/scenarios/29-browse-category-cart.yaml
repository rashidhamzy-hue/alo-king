name: browse-category-cart
smoke: true
description: "Smoke: browsing through the bot (session 5e). Order, a pin, 'What are you craving?', Burgers, a burger shop with its best sections as one catalogue message and the rest as a list, a section as products, a cart from WhatsApp, the normal checkout and a placed order that reaches the merchant marked Demo."
personas:
  cust: { role: customer, cc: "961", name: "Sim Browser" }
  merchant: { role: merchant }
steps:
  - note: this customer sees the demo shops with the simulated catalogue (staging only, +999 numbers only)
    sql: select public.sim_demo('{{cust.phone}}', '{{merchant.phone}}', true), public.sim_catalog('{{cust.phone}}', true)
  - note: Fred's Food, a demo burger shop with more than 30 items (its menu opens as products plus the list of the rest), and an item of the section the list opens first
    db:
      - sql: >
          select v.id as shop, extensions.st_y(v.location::extensions.geometry) as lat,
                 extensions.st_x(v.location::extensions.geometry) as lon, i.id as item, i.price_usd
          from public.vendors v,
               jsonb_array_elements(public.catalog_shop_menu(v.id, 'sim') -> 'sections' -> 0 -> 'products') with ordinality t(p, n)
          join public.menu_items i on i.id = (p ->> 'retailer_id')::uuid
          where v.place_id = 'ChIJE9BeY7MhHxURyekGJ41v65s' and app_private.vendor_is_demo(v.id) and v.orderable and not v.pickup_enabled
            and (public.catalog_shop_menu(v.id, 'sim') -> 'sections' -> 0 ->> 'total')::int > 30
            and exists (select 1 from app_private.vendor_browse_categories b where b.vendor_id = v.id and b.category = 'burgers')
            and t.n <= 30 and i.pricing_unit = 'each'
            and not exists (select 1 from public.menu_option_groups g where g.item_id = i.id)
          order by t.n limit 1
        row: { price_usd: ">0" }
        save: { shop: shop, lat: lat, lon: lon, item: item, price: price_usd }
  - say: { as: cust, text: "Order" }
    expect:
      - { to: cust }
  - note: many shops deliver to the shop's door, so the bot asks what they are craving, with the categories and Shops near you
    pin: { as: cust, lat: "{{vars.lat}}", lon: "{{vars.lon}}" }
    expect:
      - { to: cust, kind: list, buttons: ["cat:", "c:near"], text_any: ["craving", "نفسك"] }
  - note: Burgers lists the burger shops with their delivery fee and distance
    tap: { as: cust, id: "cat:burgers" }
    expect:
      - { to: cust, kind: list, buttons: ["pv:"], text_any: ["Burgers", "برغر"] }
  - note: the shop opens with its best sections as one catalogue message (30 items at most), then the rest as a list
    tap: { as: cust, title: "Fred" }
    expect:
      - { to: cust, kind: products }
      - { to: cust, kind: list, buttons: ["ps:"] }
  - note: the first section of the list opens as its own catalogue message, 30 items at a time
    tap: { as: cust, id: "ps:s1" }
    expect:
      - { to: cust, kind: products }
  - note: the cart from WhatsApp lands in the one basket, priced by the server, then the normal checkout
    cart: { as: cust, items: [{ id: "{{vars.item}}", qty: 2, price: "{{vars.price}}" }] }
    expect:
      - { to: cust, buttons: ["fw:self_save", "fw:self_once", "fw:other"] }
  - tap: { as: cust, id: "fw:self_save" }
    expect:
      - { to: cust, buttons: ["cur:USD", "cur:LBP"] }
  - tap: { as: cust, id: "cur:USD" }
    expect:
      - { to: cust, buttons: ["cfm:"] }
  - tap: { as: cust, id_prefix: "cfm:" }
    expect:
      - { to: merchant, buttons: ["acc:"], text: "Demo" }
    db:
      - sql: >
          select o.status, o.vendor_id = '{{vars.shop}}' as same_shop, o.food_subtotal_usd = 2 * {{vars.price}} as server_priced
          from public.orders o join public.customers c on c.id = o.customer_id
          where c.phone_e164 = '{{cust.phone}}' order by o.created_at desc limit 1
        row: { status: placed, same_shop: true, server_priced: true }
  - sql: select public.sim_demo('{{cust.phone}}', '{{merchant.phone}}', false), public.sim_catalog('{{cust.phone}}', false)
