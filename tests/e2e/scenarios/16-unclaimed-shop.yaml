name: unclaimed-shop
description: 'A customer types a Shouf shop that is not on Alo King yet: no model, the "Ask them to join" answer and shops that deliver instead (DECISIONS §39.3, §39.6).'
personas:
  cust: { role: customer, cc: "961", name: "Sim Unclaimed" }
steps:
  - say: { as: cust, text: "Order" }
    expect:
      - { to: cust }
  - pin: { as: cust, lat: 33.6869, lon: 35.5518 }
    expect:
      - { to: cust, buttons: ["ps:"] }
  - note: a Shouf shop near the pin that is still not on Alo King (not a staging demo shop; DECISIONS §39.12), and not named like a dish
    db:
      - sql: >
          with near as (
            select v.id, v.name_en,
                   extensions.st_distance(v.location, extensions.st_setsrid(extensions.st_makepoint(35.5518, 33.6869), 4326)::extensions.geography) as d
            from public.vendors v
            where v.source = 'seed_shouf_2026_10' and v.claim_status = 'unclaimed' and not v.orderable
              and not app_private.vendor_is_demo(v.id) and v.business_type::text in ('restaurant', 'cafe')
              and v.name_en ~ '^[A-Za-z][A-Za-z'' ]{6,22}$'
              and v.name_en !~* '(grill|shawarma|falafel|pizza|burger|sushi|coffee|breakfast|bakery|sweet|chicken|manoush)'
            order by d, v.name_en limit 20)
          select n.name_en as shop from near n
          where exists (select 1 from public.vendor_search_unclaimed(n.name_en, 1) s where s.vendor_id = n.id)
          order by n.d, n.name_en limit 1
        row: { shop: "~^[A-Za-z]" }
        save: { shop: shop }
  - note: the shop's name, typed; free text has no model on staging, the catalogue search and the rules answer
    say: { as: cust, text: "{{vars.shop}}" }
    expect:
      - { to: cust, text_any: ["not on Alo King yet", "Not on Alo King yet"] }
      - { to: cust, buttons: ["pv:"] }
    db:
      - sql: >
          select count(*) filter (where t.model_calls > 0) as model_turns from public.bot_turns t join public.customers c on c.id = t.customer_id
          where c.phone_e164 = '{{cust.phone}}'
        row: { model_turns: 0 }
  - note: a dish by name finds the real item with the server's price, across the shops that deliver
    say: { as: cust, text: "2 falafel" }
    expect:
      - { to: cust, buttons: ["pi:"], text_re: "Falafel|falafel" }
  - tap: { as: cust, id_prefix: "pi:" }
    expect:
      - { to: cust, buttons: ["c:checkout"], text: "2×" }
