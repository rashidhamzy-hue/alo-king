# The path a friend abroad takes (session 5g part E, DECISIONS §39.15.3; native since session 5h, §39.15.13): an ice
# breaker, a pin from $WHERE, the demo address, the craving list and Popular near you, a shop from the website opening with
# its product message, the native cart, the checkout and the order placed (friend-after.yaml waits for delivered). Needs
# vars.slug, vars.item and vars.price (a delivery-only demo shop that delivers to Baakleen, an item of its first product
# section with no choices).
steps:
  - note: $AS taps the ice breaker "Order food" (§39.15.11) on first contact; the bot asks for the location pin
    say: { as: $AS, text: "Order food" }
    expect:
      - { to: $AS }
  - note: >
      $AS is a demo tester (a real friend is enrolled by the invite link; a simulator persona here), sees the demo shops with
      the simulated catalogue, and the simulated merchant gets their order cards (never a real shop, never Rasheed's phone)
    sql: >
      select public.sim_tester('{{$AS.phone}}', true), public.sim_demo('{{$AS.phone}}', '{{merchant.phone}}', true),
             public.sim_catalog('{{$AS.phone}}', true)
    db:
      - sql: >
          select app_private.is_demo_tester(c.id) as tester from public.customers c where c.phone_e164 = '{{$AS.phone}}'
        row: { tester: true }
  - note: a pin from $WHERE, outside the delivery area, is never stored; the demo addresses, never "we don't deliver to you"
    pin: { as: $AS, lat: "$LAT", lon: "$LON" }
    expect:
      - { to: $AS, buttons: ["da:baakleen"] }
  - note: >
      the Baakleen demo address goes on as a pin would: the craving list, then Popular near you (§39.15.2); no Explore link
      (§39.15.13)
    tap: { as: $AS, id: "da:baakleen" }
    expect:
      - { to: $AS, kind: list, buttons: ["c:near"] }
      - { to: $AS }
  - note: >
      $AS opens a shop from the website (its button writes [shop:slug]); the shop opens natively with its product message
      (its cover first when it has one), never an Open menu link
    say: { as: $AS, text: "[shop:{{vars.slug}}]" }
    expect:
      - { to: $AS, kind: products }
  - note: >
      the native cart with 2 of the item, carrying the price the catalogue showed; the server prices it again, saves the
      basket and goes on to the checkout
    cart: { as: $AS, items: [{ id: "{{vars.item}}", qty: 2, price: "{{vars.price}}" }] }
    expect:
      - { to: $AS, buttons: ["fw:self_save", "fw:self_once", "fw:other"] }
    db:
      - sql: >
          select b.status, sum(bi.quantity)::int as qty, bool_and(bi.unit_price_usd = i.price_usd) as server_priced
          from public.baskets b join public.customers c on c.id = b.customer_id
          join public.basket_items bi on bi.basket_id = b.id join public.menu_items i on i.id = bi.item_id
          where c.phone_e164 = '{{$AS.phone}}' and b.status = 'open' group by b.status
        row: { status: open, qty: 2, server_priced: true }
  - tap: { as: $AS, id: "fw:self_save" }
    expect:
      - { to: $AS, buttons: ["cur:USD", "cur:LBP"] }
  - tap: { as: $AS, id: "cur:USD" }
    expect: [{ to: $AS, buttons: ["chg:USD:exact"] }]
  - tap: { as: $AS, id: "chg:USD:exact" }
    expect:
      - { to: $AS, buttons: ["cfm:"], text: "LBP" }
  - note: $AS confirms; the order card goes to the simulated merchant, marked Demo
    tap: { as: $AS, id_prefix: "cfm:" }
    expect:
      - { to: $AS }
      - { to: merchant, buttons: ["acc:"], text: "Demo" }
