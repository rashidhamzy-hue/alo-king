name: search-to-cart
smoke: true
description: "Smoke: typed search to cart (session 5e). A customer types 'burger'; the results from every shop that delivers come back as one catalogue message grouped by shop; a cart from it goes through the normal checkout to a placed order."
personas:
  cust: { role: customer, cc: "961", name: "Sim Searcher" }
  merchant: { role: merchant }
steps:
  - sql: select public.sim_demo('{{cust.phone}}', '{{merchant.phone}}', true), public.sim_catalog('{{cust.phone}}', true)
  - db:
      - sql: >
          select extensions.st_y(v.location::extensions.geometry) as lat, extensions.st_x(v.location::extensions.geometry) as lon
          from public.vendors v join app_private.vendor_browse_categories b on b.vendor_id = v.id and b.category = 'burgers'
          where v.place_id = 'ChIJE9BeY7MhHxURyekGJ41v65s' and app_private.vendor_is_demo(v.id) and v.orderable
        row: { lat: ">0" }
        save: { lat: lat, lon: lon }
  - say: { as: cust, text: "Order" }
    expect:
      - { to: cust }
  - pin: { as: cust, lat: "{{vars.lat}}", lon: "{{vars.lon}}" }
    expect:
      - { to: cust, kind: list }
  - note: typed text is searched without a model; the results are one catalogue message, a section per shop; the cart takes Fred's Food's first plain result (no options, priced each; its pin routes, unlike a shop whose pin is off the road)
    say: { as: cust, text: "burger" }
    expect:
      - { to: cust, kind: products, text_any: ["burger", "برغر"] }
    db:
      - sql: >
          select x ->> 'item_id' as item, x ->> 'price_usd' as price, x ->> 'vendor_id' as shop
          from public.customers c, public.catalog_search(c.id, 'burger', 10) r,
               jsonb_array_elements(r -> 'items') with ordinality t(x, n)
          join public.menu_items i on i.id = (x ->> 'item_id')::uuid
          join public.vendors v on v.id = i.vendor_id
          where c.phone_e164 = '{{cust.phone}}' and i.pricing_unit = 'each' and not v.pickup_enabled
            and v.place_id = 'ChIJE9BeY7MhHxURyekGJ41v65s'
            and not exists (select 1 from public.menu_option_groups g where g.item_id = i.id)
          order by n limit 1
        row: { item: "~^[0-9a-f-]{36}$" }
        save: { item: item, price: price, shop: shop }
  - cart: { as: cust, items: [{ id: "{{vars.item}}", qty: 1, price: "{{vars.price}}" }] }
    expect:
      - { to: cust, buttons: ["fw:self_save", "fw:self_once", "fw:other"] }
  - tap: { as: cust, id: "fw:self_once" }
    expect:
      - { to: cust, buttons: ["cur:USD", "cur:LBP"] }
  - tap: { as: cust, id: "cur:USD" }
    expect:
      - { to: cust, buttons: ["cfm:"] }
  - tap: { as: cust, id_prefix: "cfm:" }
    expect:
      - { to: merchant, buttons: ["acc:"] }
    db:
      - sql: >
          select o.status, o.vendor_id = '{{vars.shop}}' as same_shop from public.orders o
          join public.customers c on c.id = o.customer_id where c.phone_e164 = '{{cust.phone}}' order by o.created_at desc limit 1
        row: { status: placed, same_shop: true }
  - sql: select public.sim_demo('{{cust.phone}}', '{{merchant.phone}}', false), public.sim_catalog('{{cust.phone}}', false)
