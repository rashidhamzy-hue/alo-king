name: basket-changes
description: "Back-and-forth between sections, a quantity change, a double Checkout tap and a double Confirm tap (DECISIONS §36 scenario 4)."
personas:
  cust: { role: customer, cc: "961", name: "Sim Basket" }
  merchant: { role: merchant }
steps:
  - say: { as: cust, text: "Order" }
    expect: [{ to: cust }]
  - pin: { as: cust, lat: 33.6869, lon: 35.5518 }
    expect: [{ to: cust, buttons: ["ps:"] }]
  - note: Sandwiches, then Sides, then Sandwiches again
    tap: { as: cust, title: "Sandwiches" }
    expect: [{ to: cust, buttons: ["pi:", "Falafel"] }]
  - say: { as: cust, text: "menu" }
    expect: [{ to: cust, buttons: ["ps:"] }]
  - tap: { as: cust, title: "Sides" }
    expect: [{ to: cust, buttons: ["pi:", "Hummus"] }]
  - say: { as: cust, text: "menu" }
    expect: [{ to: cust, buttons: ["ps:"] }]
  - tap: { as: cust, title: "Sandwiches" }
    expect: [{ to: cust, buttons: ["pi:", "Falafel"] }]
  - tap: { as: cust, title: "Falafel" }
    expect: [{ to: cust, buttons: ["qt:"] }]
  - tap: { as: cust, id_re: "^qt:i\\d+:3$" }
    expect: [{ to: cust, buttons: ["c:checkout", "c:menu"], text: "3" }]
  - note: Add more, the same item once more; the basket holds 4 falafel in total
    tap: { as: cust, id: "c:menu" }
    expect: [{ to: cust, buttons: ["ps:"] }]
  - tap: { as: cust, title: "Sandwiches" }
    expect: [{ to: cust, buttons: ["pi:"] }]
  - tap: { as: cust, title: "Falafel" }
    expect: [{ to: cust, buttons: ["qt:"] }]
  - tap: { as: cust, id_re: "^qt:i\\d+:1$" }
    expect: [{ to: cust, buttons: ["c:checkout"] }]
    db:
      - sql: >
          select coalesce(sum(l.quantity), 0) as units
          from public.basket_items l join public.baskets b on b.id = l.basket_id join public.customers c on c.id = b.customer_id
          where c.phone_e164 = '{{cust.phone}}' and b.status = 'open'
        row: { units: 4 }
  - note: Checkout tapped twice in a row gives the same answer both times (Delivery / Pickup is asked until the customer chooses)
    tap: { as: cust, id: "c:checkout" }
    expect: [{ to: cust, buttons: ["c:delivery", "c:pickup"] }]
  - tap: { as: cust, id: "c:checkout" }
    expect: [{ to: cust, buttons: ["c:delivery", "c:pickup"] }]
  - note: a new address asks once who the order is for (DECISIONS §22.1)
    tap: { as: cust, id: "c:delivery" }
    expect: [{ to: cust, buttons: ["fw:self_save", "fw:self_once", "fw:other"] }]
  - note: for me, this time only (the address is not kept)
    tap: { as: cust, id: "fw:self_once" }
    expect: [{ to: cust, buttons: ["cur:USD"] }]
    db:
      - sql: >
          select a.saved, a.for_whom from public.addresses a join public.customers c on c.id = a.customer_id
          where c.phone_e164 = '{{cust.phone}}' order by a.created_at desc limit 1
        row: { saved: false, for_whom: self }
  - note: once chosen, Checkout goes straight on
    tap: { as: cust, id: "c:checkout" }
    expect: [{ to: cust, buttons: ["cur:USD"] }]
  - tap: { as: cust, id: "cur:USD" }
    expect: [{ to: cust, buttons: ["chg:USD:exact"] }]
  - note: no change needed (cash on delivery asks "Do you need change?", CUSTOMER-EXPERIENCE #35)
    tap: { as: cust, id: "chg:USD:exact" }
    expect: [{ to: cust, buttons: ["cfm:"] }]
  - note: Confirm tapped twice, only one order exists
    tap: { as: cust, id_prefix: "cfm:" }
    expect: [{ to: merchant, buttons: ["acc:"] }]
  - tap: { as: cust, id_prefix: "cfm:" }
    expect: [{ to: cust }]
    db:
      - sql: >
          select count(*) as orders from public.orders o join public.customers c on c.id = o.customer_id
          where c.phone_e164 = '{{cust.phone}}'
        row: { orders: 1 }
