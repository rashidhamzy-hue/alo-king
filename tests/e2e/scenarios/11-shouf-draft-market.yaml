name: shouf-draft-market
description: "Real Shouf merchants are loaded as unclaimed drafts and never offered to customers; the staging test market, built from Coop Baakleen's draft catalogue, takes a grocery order quoted in USD and LBP at the dated rate (DECISIONS §38.2)."
personas:
  cust: { role: customer, cc: "961", name: "Sim Shouf" }
  merchant: { role: merchant }
steps:
  - note: the Shouf load is on staging and the real Coop Baakleen is an unclaimed, unorderable draft
    db:
      - sql: >
          select count(*) filter (where v.source = 'seed_shouf_2026_10') as shouf,
                 count(*) filter (where v.source = 'seed_shouf_2026_10' and (v.orderable or v.public_page or v.claim_status <> 'unclaimed')) as live
          from public.vendors v
        row: { shouf: 314, live: 0 }
      - sql: >
          select d.status, d.source, (select sum(jsonb_array_length(s -> 'items')) from jsonb_array_elements(d.sections) s) as items
          from public.menu_drafts d join public.vendors v on v.id = d.vendor_id
          where v.place_id = 'ChIJhaAhhQMgHxURbFIi9R14X1I' and d.source = 'seed'
        row: { status: draft, source: seed, items: 45 }
  - note: the test market (the Coop's catalogue, published for the simulator) opens for this scenario only
    sql: select public.sim_market('{{merchant.phone}}', true)
  - say: { as: cust, text: "Order" }
    expect: [{ to: cust }]
  - note: a pin at the Coop offers the test shops only; no real Shouf merchant is listed
    pin: { as: cust, lat: 33.6802, lon: 35.5708 }
    expect:
      - { to: cust, buttons: ["pv:", "Alo Test Market"] }
  - tap: { as: cust, title: "Alo Test Market" }
    expect: [{ to: cust, buttons: ["ps:", "Water"] }]
  - tap: { as: cust, title: "Water" }
    expect: [{ to: cust, buttons: ["pi:", "Tannourine"] }]
  - tap: { as: cust, title: "Tannourine" }
    expect: [{ to: cust, buttons: ["qt:"] }]
  - tap: { as: cust, id_re: "^qt:i\\d+:2$" }
    expect: [{ to: cust, buttons: ["c:checkout"], text: "Tannourine" }]
  - note: the market delivers only, so there is no Delivery / Pickup question; a new address asks who the order is for (§22.1)
    tap: { as: cust, id: "c:checkout" }
    expect: [{ to: cust, buttons: ["fw:self_save", "fw:self_once", "fw:other"] }]
  - note: then a grocery checkout asks what to do with an out-of-stock item (§32.5)
    tap: { as: cust, id: "fw:self_save" }
    expect: [{ to: cust, buttons: ["sbp:call", "sbp:replace", "sbp:remove"] }]
  - note: remove it, then the cash currency
    tap: { as: cust, id: "sbp:remove" }
    expect: [{ to: cust, buttons: ["cur:USD", "cur:LBP"] }]
    db:
      - sql: >
          select b.substitution_pref from public.baskets b join public.customers c on c.id = b.customer_id
          where c.phone_e164 = '{{cust.phone}}' and b.status = 'open'
        row: { substitution_pref: remove }
  - tap: { as: cust, id: "cur:LBP" }
    expect: [{ to: cust, buttons: ["cfm:"], text_any: ["LBP", "ل.ل", "L.L"] }]
  - note: the quote is the server's, in USD and LBP at the dated rate locked on the order
    tap: { as: cust, id_prefix: "cfm:" }
    expect: [{ to: merchant, buttons: ["acc:"] }]
    db:
      - sql: >
          select o.id, o.status, o.cash_currency, o.food_subtotal_usd, o.total_usd, o.total_lbp,
                 o.usd_lbp_rate = public.usd_lbp_rate() as dated_rate, v.slug,
                 abs(o.total_lbp - o.total_usd * o.usd_lbp_rate) <= o.usd_lbp_rate as lbp_matches
          from public.orders o join public.customers c on c.id = o.customer_id join public.vendors v on v.id = o.vendor_id
          where c.phone_e164 = '{{cust.phone}}' order by o.created_at desc limit 1
        row:
          {
            status: placed,
            cash_currency: LBP,
            slug: alo-test-market,
            food_subtotal_usd: ">0",
            total_usd: ">0",
            total_lbp: ">0",
            dated_rate: true,
            lbp_matches: true,
          }
        save: { order_id: id }
  - include: { part: merchant-accepts-delivers, as: cust }
  - note: the real Coop's draft is untouched by the test order
    db:
      - sql: >
          select d.status, v.orderable, v.claim_status from public.menu_drafts d join public.vendors v on v.id = d.vendor_id
          where v.place_id = 'ChIJhaAhhQMgHxURbFIi9R14X1I' and d.source = 'seed'
        row: { status: draft, orderable: false, claim_status: unclaimed }
  - note: the test market closes again
    sql: select public.sim_market('{{merchant.phone}}', false)
