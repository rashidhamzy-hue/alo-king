name: readiness-extras
description: "The readiness items no other scenario covers (session 5d): a returning customer's greeting with the 2-tap repeat, a typed dish search without a model, STOP and START for promotions, and a voice note answered with the 'not yet' reply while voice is off (DECISIONS §38.3, §39.6, §18.3)."
personas:
  cust: { role: customer, cc: "961", name: "Sim Readiness" }
  merchant: { role: merchant }
steps:
  - include: { part: order-to-placed, as: cust, lat: 33.6869, lon: 35.5518, qty: 1 }
  - include: { part: merchant-accepts-delivers, as: cust }
  - note: a returning customer says hi and gets "same again / new order / a person"
    say: { as: cust, text: "Hi" }
    expect:
      - { to: cust, buttons: ["c:usual", "c:order"] }
  - note: one tap rebuilds the last basket at today's prices
    tap: { as: cust, id: "c:usual" }
    expect:
      - { to: cust, buttons: ["c:checkout"], text: "Falafel" }
  - note: a typed dish is searched across the shops that deliver, with no model call
    say: { as: cust, text: "hummus" }
    expect:
      - { to: cust, kind: list, buttons: ["pi:"], text_any: ["Hummus", "hummus"] }
  - say: { as: cust, text: "STOP" }
    expect:
      - { to: cust, text: "promotional" }
    db:
      - sql: select marketing_opt_in from public.customers where phone_e164 = '{{cust.phone}}'
        row: { marketing_opt_in: false }
  - say: { as: cust, text: "START" }
    expect:
      - { to: cust, text: "offers" }
    db:
      - sql: select marketing_opt_in from public.customers where phone_e164 = '{{cust.phone}}'
        row: { marketing_opt_in: true }
  - note: voice is off until its eval passes with API credit (§32.4); the note gets the "not yet" reply and the buttons
    voice: { as: cust, transcript: "bade 2 falafel" }
    expect:
      - { to: cust, text: "voice notes yet" }
    db:
      - sql: >
          select t.path from public.bot_turns t join public.customers c on c.id = t.customer_id
          where c.phone_e164 = '{{cust.phone}}' order by t.finished_at desc nulls last limit 1
        row: { path: deterministic }
